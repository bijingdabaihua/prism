# Build and deploy to GitHub Pages automatically on pushes to main.
# First-time setup: in repository Settings → Pages → Source, choose "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run only one deployment at a time so they don't overwrite each other
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build output is in dist/app (vite outDir is ../../dist/app).
      # GitHub Pages project sites are served under /prism/.
      - run: npm run build -- --base=/prism/
        env:
          VITE_PUBLIC_DEEPSEEK_API_KEY: ${{ vars.VITE_PUBLIC_DEEPSEEK_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
