# 推送到 main 自动构建并部署到 GitHub Pages。
# 首次启用：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 构建产物在 dist/app（vite outDir 是 ../../dist/app）
      - run: npm run build

      # 自定义域名：把 prism.example.com 换成你的域名。
      # 不用自定义域名的话，删掉这一步即可（裸域名 bijingdabaihua.github.io/Prism 也能跑，
      # 但需要把 vite.config.ts 的 base 改成 '/Prism/'）。
      - name: Write CNAME
        run: echo "prism.example.com" > dist/app/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
